<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>البوابة الإلكترونية الموحدة | إعادة التوجيه التلقائي</title>
    <link rel="icon" type="image/png" href="./moi-logo.png" />
    <script>
      (function() {
        var l = window.location;
        var p = l.pathname;
        if (p.includes('/portal') || p.includes('/ubari-portal')) {
          var targetPortal = p.includes('/ubari-portal') ? '/-/ubari-portal/' : '/-/portal/';
          window.location.replace(l.origin + targetPortal);
          return;
        }
        if (p.includes('/road') || p.includes('/ubari-ghat')) {
          var targetRoad = p.includes('/ubari-ghat') ? '/-/ubari-ghat/' : '/-/road/';
          window.location.replace(l.origin + targetRoad);
          return;
        }
        var repoName = '/-';
        var subpath = '';
        if (p.indexOf(repoName) !== -1) {
          subpath = p.substring(p.indexOf(repoName) + repoName.length);
        } else {
          subpath = p;
        }
        var target = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + repoName + '/#' + subpath + (l.search || '') + (l.hash || '');
        window.location.replace(target);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; background: #0a192f; color: #ffffff; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; direction: rtl;">
    <div style="text-align: center;">
      <h2 style="font-size: 20px; font-weight: 800; margin-bottom: 8px;">جهاز تنفيذ مشروعات المواصلات & وزارة الداخلية</h2>
      <p style="color: #94a3b8; font-size: 14px;">جارٍ توجيهك إلى البوابة المطلوبة بأمان واستقرار...</p>
    </div>
  </body>
</html>
