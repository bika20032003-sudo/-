  <!-- Pre-render Theme Initialization (Night Mode Default) -->
  <script>
    try {
      var saved = localStorage.getItem('portal_theme_v2');
      var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    } catch(e) {}
  </script>

    rel="stylesheet">
  <!-- GitHub Pages & Mobile WebKit Universal Asset Rescue -->
  <script>
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'IMG') {
        var img = e.target;
        if (img.dataset.rescued) return;
        img.dataset.rescued = '1';
        var rawSrc = img.getAttribute('src') || img.src || '';
        if (rawSrc.startsWith('data:') || rawSrc.startsWith('blob:')) return;
        var cleanUrl = rawSrc.split('?')[0].split('#')[0];
        var filename = cleanUrl.split('/').pop();
        if (filename && filename.indexOf('.') !== -1) {
          var p = window.location.pathname || '';
          var last = p.split('/').pop();
          var base = (last && last.indexOf('.') !== -1) ? p.substring(0, p.lastIndexOf('/') + 1) : (p.endsWith('/') ? p : p + '/');
          img.src = base + filename;
        }
      }
    }, true);
  </script>
