<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="./moi-logo.png" />

    <title>منظومة وزارة الداخلية | البوابة الإلكترونية الموحدة</title>
    
    <!-- Meta & Theme for Mobile PWA & Stability -->
    <meta name="theme-color" content="#0a192f" />
    <meta name="description" content="منظومة وزارة الداخلية الموحدة - مديرية أمن أوباري" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Automatic Image Fallback & GitHub Pages Subpath Resolver -->
    <script>
      (function() {
        // Global error listener to automatically rescue broken images on GitHub Pages subpaths
        window.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'IMG') {
            var img = e.target;
            var currentSrc = img.getAttribute('src') || '';
            if (currentSrc.startsWith('/') && !currentSrc.startsWith('//') && !img.dataset.hasRescued) {
              img.dataset.hasRescued = 'true';
              var fileName = currentSrc.substring(currentSrc.lastIndexOf('/') + 1);
              img.src = './' + fileName;
            }
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
