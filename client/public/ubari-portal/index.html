  <!-- GitHub Pages & Subpath Auto-Asset Rescue -->
  <script>
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'IMG') {
        var img = e.target;
        var src = img.getAttribute('src');
        if (src && src.startsWith('/') && !src.startsWith('//') && !img.dataset.rescued) {
          img.dataset.rescued = 'true';
          var base = window.location.pathname.endsWith('/') ? window.location.pathname : window.location.pathname + '/';
          img.src = base + src.slice(1);
        }
      }
    }, true);
  </script>
