name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (Supervision System)
        run: npm install --legacy-peer-deps

      - name: Build Supervision System
        run: |
          npm run build
          mkdir -p /tmp/supervision_backup
          cp -r dist/* /tmp/supervision_backup/
          mkdir -p dist/supervision
          cp -r /tmp/supervision_backup/* dist/supervision/ 2>/dev/null || true
          touch dist/.nojekyll
          cp public/404.html dist/404.html 2>/dev/null || true

      - name: Build Showcase Project (الموقع التعريفي)
        continue-on-error: true
        run: |
          if [ -d "الموقع التعريفي لمشروع طريق اوباري غات" ]; then
            cd "الموقع التعريفي لمشروع طريق اوباري غات"
            npm install --legacy-peer-deps || true
            npm run build || true
            cd ..
            mkdir -p dist/showcase
            mkdir -p dist/road
            cp -r "الموقع التعريفي لمشروع طريق اوباري غات/dist/"* dist/showcase/ 2>/dev/null || true
            cp -r "الموقع التعريفي لمشروع طريق اوباري غات/dist/"* dist/road/ 2>/dev/null || true
          fi

      - name: Build News Portal (البوابة الاخبارية)
        continue-on-error: true
        run: |
          if [ -d "البوابة الاخبارية لمشروع طريق اوباري غات" ]; then
            cd "البوابة الاخبارية لمشروع طريق اوباري غات"
            npm install --legacy-peer-deps || true
            npm run build || true
            cd ..
            mkdir -p dist/portal
            cp -r "البوابة الاخبارية لمشروع طريق اوباري غات/dist/"* dist/portal/ 2>/dev/null || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4