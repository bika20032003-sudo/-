name: Deploy Ministry of Interior to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies & Build Ministry of Interior System
        run: |
          cd client
          npm ci || npm install
          npm run build
          # Create SPA routing fallbacks to guarantee 0% 404 errors
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './client/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Sync Production Dist to gh-pages branch
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || git branch gh-pages
          git checkout gh-pages
          # Remove legacy road/portal folders from gh-pages
          rm -rf road ubari-ghat portal ubari-portal moi
          cp -r client/dist/. .
          touch .nojekyll
          git add -A
          git diff --staged --quiet || (git commit -m "deploy: update Ministry of Interior system [skip ci]" && git push origin gh-pages)
