name: Deploy to GitHub Pages & Sync cPanel Hosting

on:
  push:
    branches:
      - main
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Remove git history from deployment bundle
        run: rm -rf .git

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  sync-cpanel:
    name: Auto-Sync cPanel Hosting
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger cPanel Auto-Deployment Webhook
        run: |
          echo "Triggering cPanel automatic sync on ubarighatroad.ly..."
          curl -s -k -m 30 "https://ubarighatroad.ly/cpanel_deploy.php?key=supervision_deploy_secret" || true
          echo "Webhook ping completed."
